name: Hotfix weeklyRows
on:
  push:
    paths:
      - '.github/workflows/hotfix-weeklyrows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore weekly collection aggregation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='function monthlyRows()'
          fn="""function weeklyRows(){const g={};COLLECTIONS.forEach(r=>{const end=weekEnd(r.date);if(!g[end])g[end]={date:end,ss:0,wf:0,other:0,total:0};g[end].ss+=Number(r.ss)||0;g[end].wf+=Number(r.wf)||0;g[end].other+=Number(r.other)||0;g[end].total+=Number(r.total)||0});return Object.values(g).sort((a,b)=>a.date.localeCompare(b.date)).slice(-12)}"""
          if 'function weeklyRows()' not in s:
              if marker not in s: raise SystemExit('monthlyRows marker not found')
              s=s.replace(marker,fn+marker,1)
              p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name "Spin Cycle App Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix weeklyRows dashboard error"
          git push
