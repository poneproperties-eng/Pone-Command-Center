name: Add collection delete control
on:
  push:
    paths:
      - '.github/workflows/add-delete-collections.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add working delete controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='.editCollection{border:1px solid #bfdbfe;background:#fff;color:#075985;border-radius:8px;padding:6px 10px;font-weight:850;cursor:pointer;flex:0 0 auto}'
          css2=css+'.deleteCollection{border:1px solid #fecaca;background:#fff;color:#b91c1c;border-radius:8px;padding:6px 10px;font-weight:850;cursor:pointer;flex:0 0 auto}.historyActions{display:flex;gap:7px;align-items:center;flex:0 0 auto}'
          if '.deleteCollection{' not in s:
            if css not in s: raise SystemExit('Edit CSS marker not found')
            s=s.replace(css,css2,1)
          marker='function shortDate(d)'
          fn="async function deleteCollection(i){const r=COLLECTIONS[i];if(!r)return;const label=r.type==='weekly'?'Week '+weekRange(r.date):fmtMDY(r.date);if(!confirm('Delete '+label+' collection? This cannot be undone.'))return;try{await postCentral({action:'delete_collection',entry_type:r.type,collection_date:r.date})}catch(e){alert('Could not delete collection: '+e.message)}}"
          if 'async function deleteCollection(i)' not in s:
            if marker not in s: raise SystemExit('Function marker not found')
            s=s.replace(marker,fn+marker,1)
          old='<button class="editCollection" onclick="editCollection(\'+i+\')">Edit</button>'
          new='<span class="historyActions"><button class="editCollection" onclick="editCollection(\'+i+\')">Edit</button><button class="deleteCollection" onclick="deleteCollection(\'+i+\')">Delete</button></span>'
          if 'class="deleteCollection" onclick="deleteCollection(' not in s:
            if old not in s: raise SystemExit('Edit button marker not found')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "Spin Cycle App Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add working Delete button for collections"
          git push
