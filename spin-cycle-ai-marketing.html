<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082f49">
<title>Spin Cycle AI Marketing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f0f9ff;color:#0f172a}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.ownerbar{background:#fff;border-bottom:1px solid #dbeafe;padding:9px 12px;box-shadow:0 3px 12px #0c4a6e12;z-index:5}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:9px;font-weight:950;color:#075985}.brand img{width:36px;height:36px;object-fit:contain}.simple{font-size:12px;color:#64748b;margin-top:2px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #bfdbfe;background:#eff6ff;color:#075985;border-radius:999px;padding:9px 13px;font-weight:900;cursor:pointer}.btn.home{background:#075985;color:#fff;border-color:#075985}.btn:hover{filter:brightness(.98)}.next{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,#eff6ff,#f0fdfa);border:1px solid #bfdbfe;border-radius:12px;padding:9px 11px}.nextText{font-size:12px;color:#475569}.nextText b{display:block;color:#0f3f66;font-size:13px;margin-bottom:2px}.nextBtns{display:flex;gap:7px;flex-wrap:wrap}.nextBtn{border:0;border-radius:10px;padding:8px 11px;font-weight:900;cursor:pointer;background:#fff;color:#075985;box-shadow:0 2px 7px #0c4a6e12}.frame{width:100%;height:100%;border:0;background:#f0f9ff}.hint{font-size:11px;color:#64748b}@media(max-width:760px){.row{align-items:flex-start}.actions{width:100%}.btn{flex:1}.next{align-items:flex-start;flex-direction:column}.nextBtns{width:100%}.nextBtn{flex:1}}
</style>
</head>
<body>
<div class="app">
  <div class="ownerbar">
    <div class="row">
      <div>
        <div class="brand"><img src="/icon-192.png" alt="Spin Cycle"><span>SPIN CYCLE AI MARKETING</span></div>
        <div class="simple">Keep it simple: look at the numbers, see what needs attention, then create the marketing.</div>
      </div>
      <div class="actions">
        <button class="btn home" id="homeBtn">My Dashboard</button>
        <button class="btn" id="growthBtn">What Should I Fix?</button>
        <button class="btn" id="campaignBtn">Create Marketing</button>
      </div>
    </div>
    <div class="next">
      <div class="nextText"><b>WHAT DO I DO NEXT?</b><span id="nextCopy">Start by reviewing Today, Last 7 Days and Last 30 Days below. Green is good, yellow needs watching, red needs attention.</span></div>
      <div class="nextBtns">
        <button class="nextBtn" id="showNumbers">1. Look at My Numbers</button>
        <button class="nextBtn" id="showGrowth">2. Tell Me What to Fix</button>
        <button class="nextBtn" id="showCampaign">3. Fix It for Me</button>
      </div>
    </div>
  </div>
  <iframe class="frame" id="mainFrame" src="/index.html?embedded=1" title="Spin Cycle AI Marketing Dashboard"></iframe>
</div>
<script>
const frame=document.getElementById('mainFrame');
function openDashboard(){frame.src='/index.html?embedded=1';document.getElementById('nextCopy').textContent='Start by reviewing Today, Last 7 Days and Last 30 Days below. Green is good, yellow needs watching, red needs attention.'}
function openGrowth(){frame.src='/owner-growth.html';document.getElementById('nextCopy').textContent='Enter owner code 4398. The app will show what is weak, what may be wasting money, and what to work on next.'}
function openCampaign(){frame.src='/campaign-studio.html';document.getElementById('nextCopy').textContent='Build and preview the campaign. You approve the offer and budget before any paid advertising launches.'}
document.getElementById('homeBtn').onclick=openDashboard;
document.getElementById('growthBtn').onclick=openGrowth;
document.getElementById('campaignBtn').onclick=openCampaign;
document.getElementById('showNumbers').onclick=openDashboard;
document.getElementById('showGrowth').onclick=openGrowth;
document.getElementById('showCampaign').onclick=openCampaign;
</script>
</body>
</html>
